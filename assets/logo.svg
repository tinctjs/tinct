<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- imagepipe — "The Bore": an image block with the pipe bored through it.
       The hole is true negative space, so this single flat mark works on any
       background; no dark-mode variant needed. Ink #23201C pairs with
       safelight amber #F07818 across the identity. -->
  <defs>
    <mask id="bore">
      <rect x="14" y="14" width="68" height="68" rx="17" fill="#fff"/>
      <circle cx="58" cy="48" r="16" fill="#000"/>
    </mask>
  </defs>
  <rect x="14" y="14" width="68" height="68" rx="17" fill="#f07818" mask="url(#bore)"/>
</svg>
