name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC: lets npm verify this workflow's identity

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret
      # anywhere. The trusted publisher is configured on the npm package
      # settings: org imagepipe, repo imagepipe, workflow release.yml. Requires
      # npm >= 11.5.1 for the OIDC token exchange; provenance is automatic.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Opens/updates a "Version Packages" PR while changesets accumulate;
      # publishes to npm when that PR is merged.
      - uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
