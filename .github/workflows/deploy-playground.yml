name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build playground
        run: npm install && npm run build
        working-directory: playground
      - name: Build examples
        run: |
          for app in avatar-studio lookbook optimizer collage booth; do
            (cd "examples/$app" && npm install && npm run build)
          done
      - name: Assemble site (playground at /, examples at /<name>/)
        run: |
          mkdir -p site
          cp -r playground/dist/* site/
          for app in avatar-studio lookbook optimizer collage booth; do
            mkdir -p "site/$app"
            cp -r "examples/$app/dist/"* "site/$app/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
