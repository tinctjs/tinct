name: Bug report
description: Something doesn't work the way it's documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A code snippet or link (StackBlitz/CodeSandbox) that reproduces it.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tinctjs version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 / macOS 15
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: tinct.capabilities() output
      description: Helps us tell CPU-path from GPU-path bugs.
      render: json
