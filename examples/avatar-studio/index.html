<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar Studio — a Tinct example</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, sans-serif; background: #f4f2ee; color: #262220;
      }
      main { width: min(680px, 94vw); padding: 2.5rem 0; }
      h1 { font-size: 1.5rem; letter-spacing: -0.02em; margin: 0; }
      h1 span { color: #b0562b; }
      .sub { color: #7a726c; margin: 0.3rem 0 1.5rem; font-size: 0.92rem; }
      .card { background: #fff; border: 1px solid #e5ded7; border-radius: 16px; padding: 1.5rem; }
      .stage { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
      .drop {
        flex: 1; min-width: 220px; min-height: 200px; border: 2px dashed #d8cfc6;
        border-radius: 12px; display: grid; place-items: center; color: #98908a;
        font-size: 0.9rem; text-align: center; cursor: pointer; padding: 1rem;
      }
      .drop.armed { border-color: #b0562b; color: #b0562b; background: #faf4ef; }
      .result { display: grid; gap: 0.6rem; justify-items: center; }
      .result canvas { border-radius: 50%; border: 4px solid #efe8e1; max-width: 200px; height: auto; }
      .meta { font-size: 0.78rem; color: #7a726c; font-variant-numeric: tabular-nums; }
      .controls { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-top: 1.25rem; align-items: end; }
      label { font-size: 0.78rem; color: #7a726c; display: grid; gap: 0.3rem; }
      select, button { font: inherit; padding: 0.45rem 0.8rem; border-radius: 8px; border: 1px solid #d8cfc6; background: #fff; }
      button.primary { background: #b0562b; color: #fff; border-color: #b0562b; cursor: pointer; }
      button.primary:disabled { opacity: 0.4; cursor: default; }
      .foot { margin-top: 1.25rem; font-size: 0.78rem; color: #98908a; }
      .foot a { color: #b0562b; }
      input[type='file'] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Avatar <span>Studio</span></h1>
      <p class="sub">
        Drop any photo → face-aware square crop → tuned look → WebP under a size budget.
        Built on <code>tinctjs</code> in ~120 lines.
      </p>
      <div class="card">
        <div class="stage">
          <div class="drop" id="drop">drop a photo here<br />or click to choose</div>
          <input type="file" id="file" accept="image/*" />
          <div class="result">
            <div id="preview"></div>
            <div class="meta" id="meta">no image yet</div>
          </div>
        </div>
        <div class="controls">
          <label>Size
            <select id="size">
              <option value="128">128 px</option>
              <option value="256" selected>256 px</option>
              <option value="512">512 px</option>
            </select>
          </label>
          <label>Look
            <select id="look">
              <option value="none">Natural</option>
              <option value="warm" selected>Golden hour</option>
              <option value="mono">Monochrome</option>
            </select>
          </label>
          <label>Budget
            <select id="budget">
              <option value="20000">≤ 20 kB</option>
              <option value="50000" selected>≤ 50 kB</option>
              <option value="150000">≤ 150 kB</option>
            </select>
          </label>
          <button class="primary" id="download" disabled>Download avatar</button>
        </div>
      </div>
      <p class="foot">
        The face detector is deterministic, on-device, zero-dependency —
        <a href="https://github.com/tinctjs/tinct">github.com/tinctjs/tinct</a>
      </p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
